<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontak Föyü (dev)</title>
<!--
  _capture.html — DEV harness for bin/screenshot.sh (contact sheet).
  Loads the REAL engine (scripts/main.js), lets it render a deck into the
  hidden #app host, then CLONES each rendered <section class="slide"> into a
  scaled CSS grid. No template duplication → thumbnails match the live
  presentation. Headless Chrome takes ONE full-page screenshot of the grid.
  Not linked from the site; ?week=weekN picks the deck (default = manifest[0]).
  onRender/interactive bits do NOT run here (static render) — that's fine for
  a layout/content overview.
-->
<link rel="stylesheet" href="styles/engine.css?v=1.3.0">
<link rel="stylesheet" href="styles/main.css">
<style>
  html, body { background:#0a0a0a; margin:0; }
  body { padding:24px; }
  /* engine's live host stays in the DOM (engine needs these IDs) but hidden */
  #app { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; left:-9999px; }
  .ct-head { color:#e8e8e8; font:600 15px/1.4 system-ui,-apple-system,sans-serif; margin:0 0 18px; }
  .ct-head small { color:#7a7a7a; font-weight:400; }
  .ct-grid { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .ct-thumb { display:flex; flex-direction:column; }
  .ct-frame {
    width:var(--tw); height:var(--th); overflow:hidden; position:relative;
    border:1px solid #262626; border-radius:7px; background:#000;
  }
  .ct-stage {
    width:1280px; height:720px; position:absolute; top:0; left:0;
    transform: scale(var(--scale)); transform-origin: top left;
  }
  /* un-stack the cloned slide: flow in place, fully visible, fixed stage size */
  .ct-stage .slide {
    position:relative !important; inset:auto !important;
    width:1280px !important; height:720px !important;
    opacity:1 !important; visibility:visible !important; z-index:auto !important;
  }
  /* freeze entrance animations → final state, zero timing dependence */
  .ct-stage .slide, .ct-stage .slide * { animation:none !important; transition:none !important; }
  .ct-cap { color:#bdbdbd; font:500 12px/1.35 ui-monospace,"SF Mono",monospace; margin-top:7px; max-width:var(--tw); }
  .ct-cap b { color:#fff; }
  .ct-cap .meta { color:#666; }
</style>
</head>
<body>
  <!-- minimal host the engine wires to (hidden) -->
  <div id="app">
    <select id="week-select"></select>
    <main id="slide-container" tabindex="-1"></main>
    <ul id="nav-dots"></ul>
    <span id="current-slide-num"></span><span id="total-slides-num"></span>
  </div>

  <div class="ct-head" id="ct-head">Kontak föyü hazırlanıyor…</div>
  <div class="ct-grid" id="ct-grid"></div>

  <!-- the real engine -->
  <script type="module" src="scripts/main.js"></script>

  <!-- contact-sheet builder -->
  <script type="module">
    const COLS = 3, GAP = 16;
    const params = new URLSearchParams(location.search);

    // wait until the engine has instantiated + done its first render
    const waitEngine = () => new Promise(res => {
      (function poll(){
        if (window.presentation && Array.isArray(window.presentation.slideElements)) res();
        else setTimeout(poll, 25);
      })();
    });
    await waitEngine();
    const eng = window.presentation;

    // switch deck if requested (engine default already loaded otherwise)
    const week = params.get('week');
    if (week && week !== eng.currentWeekKey) await eng.loadWeek(week);
    await new Promise(r => requestAnimationFrame(r));
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }

    // thumbnail geometry from the grid's real width
    const grid = document.getElementById('ct-grid');
    const gridW = grid.clientWidth || 1240;
    const tw = Math.floor((gridW - GAP * (COLS - 1)) / COLS);
    const scale = tw / 1280;
    const th = Math.round(720 * scale);
    const root = document.documentElement.style;
    root.setProperty('--tw', tw + 'px');
    root.setProperty('--th', th + 'px');
    root.setProperty('--scale', scale);

    // mirror the engine's fitSlide so each thumb scales content exactly as live
    const fit = (slideEl) => {
      const inner = slideEl.querySelector('.slide-inner');
      if (!inner) return;
      inner.style.transform = '';
      const cs = getComputedStyle(slideEl);
      const availH = slideEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const availW = slideEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const needH = inner.scrollHeight, needW = inner.scrollWidth;
      if (needH <= 0 || needW <= 0 || availH <= 0) return;
      let s = Math.min(availH / needH, availW / needW, 1);
      if (s < 1) inner.style.transform = `scale(${Math.max(s, 0.4)})`;
    };

    const data = eng.slides || [];
    eng.slideElements.forEach((el, i) => {
      const clone = el.cloneNode(true);
      clone.classList.add('active');                 // trigger .active visible state

      const stage = document.createElement('div'); stage.className = 'ct-stage';
      const frame = document.createElement('div'); frame.className = 'ct-frame';
      const thumb = document.createElement('div'); thumb.className = 'ct-thumb';
      stage.appendChild(clone);
      frame.appendChild(stage);
      thumb.appendChild(frame);

      const cap = document.createElement('div'); cap.className = 'ct-cap';
      const d = data[i] || {};
      cap.innerHTML = `<b>${i + 1}.</b> ${d.title || '(başlıksız)'} <span class="meta">#${d.id || '?'} · ${d.type || 'standard'}</span>`;
      thumb.appendChild(cap);
      grid.appendChild(thumb);

      fit(clone);                                    // now in DOM + visible → measures right
    });

    document.getElementById('ct-head').innerHTML =
      `${eng.currentWeekKey} · ${eng.slideElements.length} slayt ` +
      `<small>kontak föyü (dev render — etkileşim/onRender çalışmaz)</small>`;
    document.title = `kontak: ${eng.currentWeekKey} (${eng.slideElements.length})`;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
